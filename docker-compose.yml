services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: plas
      POSTGRES_USER: plas
      POSTGRES_PASSWORD: plas_change_me
    ports:
      - "5432:5432"
    volumes:
      - plas_db:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://plas:plas_change_me@db:5432/plas
      SECRET_KEY: change-this-secret-in-production
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  plas_db:
